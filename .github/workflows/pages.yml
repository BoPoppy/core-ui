name: Deploy catalog to Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  # Required to download artifacts from a different workflow run.
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # --- workflow_run path: reuse the artifact CI already built ---
      - name: Download playground artifact from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: playground-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: playground/dist

      # --- workflow_dispatch path: build from scratch ---
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
      - uses: pnpm/action-setup@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          version: 11
      - uses: actions/setup-node@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build playground
        if: github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile && pnpm build:playground

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
