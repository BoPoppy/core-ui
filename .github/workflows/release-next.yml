name: Release (pre-release)

# Publishes a versioned pre-release whenever the `next` branch is pushed.
# To enter pre-release mode on that branch, run once:
#   pnpm changeset pre enter next
# then commit the resulting .changeset/pre.json.
# Exit pre-release mode when you're ready to cut a stable release:
#   pnpm changeset pre exit

on:
  push:
    branches: [next]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-next:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@bopoppy"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create pre-release PR or publish pre-release to GitHub Packages
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
