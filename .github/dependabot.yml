version: 2
updates:
  # npm / pnpm dependencies (Dependabot reads pnpm-lock.yaml under the npm ecosystem).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk dev-dependency bumps into one PR to cut noise.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keep GitHub Actions (checkout, setup-node, pnpm, pages, changesets) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
